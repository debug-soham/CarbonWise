<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarbonWise - Create Account</title>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@200,300,400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="auth-page">
        <div class="auth-container">

            <a href="index.html" class="auth-logo">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/>
                </svg>
                <span>CARBONWISE</span>
            </a>

            <h1>Start making<br>impact personal</h1>
            <p class="subtitle">Set up your dashboard and turn everyday<br>choices into meaningful progress.</p>

            <form class="auth-form" id="register-form">
                <div class="form-group">
                    <label>Full name</label>
                    <input type="text" id="reg-name" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label>Email address</label>
                    <input type="email" id="reg-email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Create password</label>
                    <input type="password" id="reg-password" placeholder="At least 8 characters" required minlength="8">
                </div>
                <button type="submit" class="btn btn-primary btn-submit">Create account</button>
            </form>

            <div class="auth-links">
                <div class="link-group">
                    By continuing, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
                </div>
                <div class="link-group">
                    Already have an account? <a href="signin.html">Sign in</a>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
